<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consulta de CEP - ViaCEP</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Consulta de CEP</h1>
      <p class="subtitle">Digite um CEP para buscar o endereço usando a API do ViaCEP.</p>

      <form id="cepForm" class="form">
        <label for="cep">CEP</label>
        <div class="input-group">
          <input
            type="text"
            id="cep"
            name="cep"
            placeholder="Ex: 01001-000"
            maxlength="9"
            autocomplete="postal-code"
          />
          <button type="submit" id="buscarBtn">Buscar</button>
        </div>
        <small>Digite somente números ou use o formato 00000-000.</small>
      </form>

      <p id="mensagem" class="mensagem"></p>

      <section id="resultado" class="resultado hidden" aria-live="polite">
        <h2>Endereço encontrado</h2>

        <div class="grid">
          <div>
            <span>CEP</span>
            <strong id="resCep">-</strong>
          </div>

          <div>
            <span>Logradouro</span>
            <strong id="resLogradouro">-</strong>
          </div>

          <div>
            <span>Bairro</span>
            <strong id="resBairro">-</strong>
          </div>

          <div>
            <span>Cidade</span>
            <strong id="resCidade">-</strong>
          </div>

          <div>
            <span>Estado</span>
            <strong id="resEstado">-</strong>
          </div>

          <div>
            <span>DDD</span>
            <strong id="resDdd">-</strong>
          </div>
        </div>

        <button type="button" id="limparBtn" class="btn-secondary">Limpar</button>
      </section>
    </section>
  </main>
</body>
</html>
